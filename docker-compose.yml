# Retrieval stores for the Graph RAG memory (docs/14). Both are local containers with no auth
# beyond the Neo4j password below; data persists in named volumes.
#
#   docker compose up -d          # start Qdrant + Neo4j
#   docker compose down -v        # stop and wipe
services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/persona-dev
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
volumes:
  qdrant-data:
  neo4j-data:
