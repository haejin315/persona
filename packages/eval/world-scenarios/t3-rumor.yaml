# T3 · 소문 (docs/10 test ladder). User + three main characters, two hops.
# Day 1 morning: the user asks Haru for the bookshop errand and tells her one private thing. Day 1
# afternoon: Haru x Yoon scene at the bookshop (task). Day 1 evening: Yoon x Sunyoung (Haru's aunt)
# routine scene at the bookshop - Yoon has news, so the world runs it. Day 2 afternoon: the user
# talks to SUNYOUNG at the café. Measured: does she know only what Yoon passed on, with "윤 사장이
# 그러더라고" attached; does she NOT know what never reached her (the secret, details Yoon kept);
# how much of the afternoon survives two hops. Then Haru, who never met her aunt in between, is
# asked whether she told her: she must not know how the aunt knows.
id: t3-rumor
world: haru-town
lang: ko
persona:
  name: 민수
  description: 28살, 작은 디자인 회사에 올해 들어온 신입. 몇 달째 아침마다 카페 '모퉁이'에 오는 단골. 오후에 가게를 보는 이모(선영)와는 몇 번 마주친 정도.
userStyle: >
  존댓말. 짧게 1~2문장으로 말하고, 지문은 세 번에 한 번 정도 짧게 쓴다. 감정보다 상황을 말한다.
  상대가 전에 한 말을 가끔 되짚어 말한다.
seedMemory:
  haru:
    summary: >
      민수는 몇 달 동안 매일 아침 7시쯤 와서 아메리카노를 마시는 단골이다. 서로 이름을 알게 된 뒤로 주문 외의 대화를 조금씩 주고받는다.
      하루는 어제 아침 민수에게 "내일 오후에 이모 심부름으로 헌책방 '책다락'에 간다"고 말했다.
    facts:
      - { text: "민수의 이름은 민수다", source: user }
      - { text: "민수는 디자인 회사에 올해 들어온 신입이다", source: user }
      - { text: "민수는 고양이 보리를 키운다", source: user }
      - { text: "민수는 어릴 때 '달빛 고양이'라는 만화를 그렸다", source: user }
      - { text: "하루는 이모 심부름으로 헌책방 '책다락'에 가서 이모가 주문한 책을 받아 오기로 했다 (afternoon; told 민수 the day before)", source: self, day: 1 }
    relationship:
      stage: friendly
      notes: ["서로 이름을 알고 가벼운 농담을 주고받는다"]
  yoon:
    summary: >
      민수는 몇 번 들른 손님이다. 지난주에 옛 만화책 『달빛 고양이』 단행본 두 권을 찾아 달라고 부탁하고 책값을 미리 냈다.
      하루는 카페 '모퉁이'의 바리스타로 이모 선영이 주문한 책을 받아 가려고 가끔 들른다. 선영은 저녁마다 들러 책을 주문하고 동네 얘기를 한다.
    facts:
      - { text: "민수는 지난주에 『달빛 고양이』 단행본 두 권을 찾아 달라고 부탁하고 책값을 미리 냈다", source: user }
      - { text: "하루는 카페 '모퉁이'의 바리스타이고 이모 선영이 주문한 책을 받아 가려고 가끔 들른다", source: witnessed }
      - { text: "선영은 카페 '모퉁이'의 주인이고 저녁마다 책다락에 들러 책을 주문하고 동네 얘기를 한다", source: witnessed }
    relationship:
      stage: acquaintance
      notes: ["책을 찾아 달라고 부탁한 손님"]
  imo:
    summary: >
      민수는 아침 단골이라 얼굴과 아메리카노 주문은 안다. 오후에 가게를 보는 선영과는 몇 번 마주쳤을 뿐이고 이름은 모른다.
      하루가 민수 얘기를 한 적은 없다. 선영은 저녁마다 책다락에 들러 윤 사장과 동네 얘기를 한다.
    facts:
      - { text: "아침 단골 손님(민수)은 매일 아메리카노를 마신다", source: witnessed }
      - { text: "하루가 선영의 심부름으로 책다락에 가서 주문한 책을 받아 오기로 했다 (afternoon)", source: self, day: 1 }
    relationship:
      stage: initial
      notes: ["아침 단골, 몇 번 마주친 정도"]
phases:
  - kind: chat
    expectTask: true
    characterId: haru
    userTurns: 6
    beats:
      - fromUserTurn: 1
        goal: 평소처럼 아침 커피를 주문하며 인사한다. 하루가 어제 "내일 오후에 이모 심부름으로 책다락에 간다"고 한 말을 떠올리며 오늘 오후에 가는 게 맞는지 확인한다.
      - fromUserTurn: 2
        goal: >
          심부름을 부탁한다. 오늘 오후에 책다락에 가면, 민수가 지난주에 사장님께 찾아 달라고 부탁해 둔 옛 만화책 『달빛 고양이』 단행본(90년대, 두 권짜리)이
          들어왔는지 물어보고, 들어왔으면 대신 받아 와 달라고. 책값은 지난주에 미리 냈다고 말한다.
        reveal:
          - 민수는 지난주에 책다락 사장님께 『달빛 고양이』 단행본(두 권)을 찾아 달라고 부탁하고 책값을 미리 냈다
      - fromUserTurn: 4
        goal: >
          하루에게만 털어놓는다. 판교의 큰 회사에서 이직 제안을 받았고 다음 주까지 답해야 하는데 아직 아무에게도 말하지 않았다고.
          하루 말고는 모르는 얘기라고 한다. 그 뒤 출근한다고 인사한다.
        reveal:
          - 민수는 판교의 큰 회사에서 이직 제안을 받았고 다음 주까지 답해야 한다. 하루 외에는 아무에게도 말하지 않았다
  - kind: advance
    days: 1
  - kind: chat
    characterId: imo
    slot: afternoon
    userTurns: 6
    beats:
      - fromUserTurn: 1
        goal: 다음날 오후, 평소와 다른 시간에 카페에 들어가 이모(선영)에게 인사하고 아메리카노를 주문한다. 자기 이름을 밝힌다. 하루 씨가 어제 책다락에 다녀왔다고 들었는지 묻는다.
      - fromUserTurn: 2
        goal: 어제 책다락에서 있었던 일에 대해 들은 게 있는지, 자기 책(달빛 고양이) 얘기도 들었는지 묻는다. 선영이 말하지 않은 세부는 캐묻되 답을 암시하지 않는다.
      - fromUserTurn: 4
        goal: 혹시 자기 회사 일이나 이직 얘기도 들은 게 있는지 묻는다. 그 뒤 고맙다고 하고 가볍게 마무리한다.
    probes:
      - atUserTurn: 1
        kind: recall
        ask: 하루 씨가 어제 책다락에 다녀왔다고 들었는지 묻는다
        expected: "@ledger.told (what Yoon passed on to her; nothing more)"
      - atUserTurn: 2
        kind: recall
        ask: 어제 책다락에서 있었던 일과 자기 책 얘기를 들었는지 묻는다
        expected: "@ledger.told (attributed to 윤 사장)"
      - atUserTurn: 4
        kind: negative
        ask: 자기 회사 일이나 이직 얘기도 들었는지 묻는다
        expected: "@ledger.none (the secret never reached her)"
  - kind: chat
    characterId: haru
    slot: evening
    userTurns: 4
    beats:
      - fromUserTurn: 1
        goal: 같은 날 저녁 무렵 카페에 들러, 어제 책다락에서 사장님과 무슨 얘기를 했는지 묻는다.
      - fromUserTurn: 3
        goal: 이모님이 자기 책 얘기를 알고 있던데 하루가 이모에게 말했는지 묻는다. 그 뒤 가볍게 마무리한다.
    probes:
      - atUserTurn: 1
        kind: recall
        ask: 어제 책다락에서 사장님과 무슨 얘기를 했는지 묻는다
        expected: "@ledger.result and details"
      - atUserTurn: 3
        kind: negative
        ask: 이모에게 민수의 책 얘기를 했는지 묻는다
        expected: "@ledger (Haru did not meet her aunt after the bookshop; she must say she did not tell her and must not claim to know how the aunt knows)"
