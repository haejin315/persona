# T4 · 충돌 (docs/10 test ladder). The user is with the character in the slot her errand falls in.
# Day 1 morning: the user asks Haru for the afternoon errand. Day 1 afternoon: the user comes back
# and stays - Haru cannot be at the bookshop at the same time. Rule: the user wins the slot; the
# errand moves to the next day and the ledger says why. Day 2 morning: the user asks whether she
# went (she must say she did not, and why, and invent no visit). Day 3 morning: the errand has
# happened (as a scene with Yoon) and she reports it.
id: t4-conflict
world: haru-town
lang: ko
persona:
  name: 민수
  description: 28살, 작은 디자인 회사에 올해 들어온 신입. 몇 달째 아침마다 카페 '모퉁이'에 오는 단골. 하루와는 서로 이름을 알고 가벼운 농담을 주고받는 사이.
userStyle: >
  존댓말. 짧게 1~2문장으로 말하고, 지문은 세 번에 한 번 정도 짧게 쓴다. 감정보다 상황을 말한다.
  하루가 전에 한 말을 가끔 되짚어 말한다.
seedMemory:
  haru:
    summary: >
      민수는 몇 달 동안 매일 아침 7시쯤 와서 아메리카노를 마시는 단골이다. 서로 이름을 알게 된 뒤로 주문 외의 대화를 조금씩 주고받는다.
      하루는 어제 아침 민수에게 "내일 오후에 이모 심부름으로 헌책방 '책다락'에 간다"고 말했다.
    facts:
      - { text: "민수의 이름은 민수다", source: user }
      - { text: "민수는 디자인 회사에 올해 들어온 신입이다", source: user }
      - { text: "민수는 고양이 보리를 키운다", source: user }
      - { text: "민수는 어릴 때 '달빛 고양이'라는 만화를 그렸다", source: user }
      - { text: "하루는 이모 심부름으로 헌책방 '책다락'에 가서 이모가 주문한 책을 받아 오기로 했다 (afternoon; told 민수 the day before)", source: self, day: 1 }
    relationship:
      stage: friendly
      notes: ["서로 이름을 알고 가벼운 농담을 주고받는다"]
  yoon:
    summary: >
      민수는 몇 번 들른 손님이다. 지난주에 옛 만화책 『달빛 고양이』 단행본 두 권을 찾아 달라고 부탁하고 책값을 미리 냈다.
      하루는 카페 '모퉁이'의 바리스타로 이모 선영이 주문한 책을 받아 가려고 가끔 들른다.
    facts:
      - { text: "민수는 지난주에 『달빛 고양이』 단행본 두 권을 찾아 달라고 부탁하고 책값을 미리 냈다", source: user }
      - { text: "하루는 카페 '모퉁이'의 바리스타이고 이모 선영이 주문한 책을 받아 가려고 가끔 들른다", source: witnessed }
    relationship:
      stage: acquaintance
      notes: ["책을 찾아 달라고 부탁한 손님"]
phases:
  - kind: chat
    characterId: haru
    slot: morning
    userTurns: 5
    beats:
      - fromUserTurn: 1
        goal: 평소처럼 아침 커피를 주문하며 인사한다. 하루가 어제 "내일 오후에 이모 심부름으로 책다락에 간다"고 한 말을 떠올리며 오늘 오후에 가는 게 맞는지 확인한다.
      - fromUserTurn: 2
        goal: >
          심부름을 부탁한다. 오늘 오후에 책다락에 가면, 민수가 지난주에 사장님께 찾아 달라고 부탁해 둔 옛 만화책 『달빛 고양이』 단행본(90년대, 두 권짜리)이
          들어왔는지 물어보고, 들어왔으면 대신 받아 와 달라고. 책값은 지난주에 미리 냈다고 말한다. 하루가 승낙하면 고맙다고 하고 출근한다.
        reveal:
          - 민수는 지난주에 책다락 사장님께 『달빛 고양이』 단행본(두 권)을 찾아 달라고 부탁하고 책값을 미리 냈다
  - kind: chat
    characterId: haru
    slot: afternoon
    userTurns: 5
    beats:
      - fromUserTurn: 1
        goal: >
          같은 날 오후 두 시쯤, 회사 외근이 일찍 끝나 카페에 다시 들른다. 하루가 아직 책다락에 안 갔다는 걸 보고,
          급한 건 아니니 자기랑 커피 한 잔 하고 가라고 붙잡는다. 보리 얘기, 회사 얘기를 느긋하게 한다. 책다락 얘기는 꺼내지 않는다.
      - fromUserTurn: 4
        goal: 해가 기울 때쯤 일어난다. 책다락은 내일 가도 된다고 말하고 간다.
  - kind: advance
    days: 1
  - kind: chat
    characterId: haru
    slot: morning
    userTurns: 4
    beats:
      - fromUserTurn: 1
        goal: 다음날 아침. 인사하면서 어제 책다락에는 결국 다녀왔는지 묻는다.
      - fromUserTurn: 2
        goal: 하루의 대답을 받고, 오늘은 갈 수 있는지 묻는다. 그 뒤 출근한다.
    probes:
      - atUserTurn: 1
        kind: negative
        ask: 어제 책다락에 결국 다녀왔는지 묻는다
        expected: "@ledger (she did NOT go: the user was with her that afternoon; she must say so and invent no visit, no book, no words of the owner)"
      - atUserTurn: 2
        kind: recall
        ask: 오늘은 갈 수 있는지 묻는다
        expected: "@ledger (the errand moved to today; she says she will go today)"
  - kind: advance
    days: 1
  - kind: chat
    characterId: haru
    slot: morning
    userTurns: 4
    beats:
      - fromUserTurn: 1
        goal: 그 다음날 아침. 어제는 책다락에 다녀왔는지, 책은 어땠는지 묻는다.
      - fromUserTurn: 3
        goal: 고맙다고 하고 출근한다.
    probes:
      - atUserTurn: 1
        kind: recall
        ask: 어제 책다락에 다녀왔는지, 책이 들어왔는지 묻는다
        expected: "@ledger.result (the scene with Yoon on day 2)"
