# T10 · 주의 (docs/10 test ladder). Who lives in full while the user is away, decided by judgment
# rather than by a rule. Day 1 (Monday) morning: the user tells Haru he is away for a week from
# tomorrow, asks her to collect his prepaid books from the bookshop, and mentions that the foreman
# will look at his flat's balcony leak once he is back (the foreman already knows: seed fact).
# Nothing connects the tofu-stall owner to him. Seven days pass. Day 8: Haru (the errand, the gap,
# what happened around), the foreman (the plan, what he knows of the week), and the bookshop owner
# (did he hand the books to Haru himself?). Arms: one attention call with a cap of 3, the 7-day
# rule, and everyone main. The rule drops Yoon (never spoken to, no errand of his own), so Haru's
# errand is resolved without him and he never knows he handed the books over. The agreement check
# reads Haru's and Yoon's day-8 conversations side by side: the probes alone pass both of them.
id: t10-attention
world: haru-town-5
lang: ko
persona:
  name: 민수
  description: 28살, 작은 디자인 회사에 올해 들어온 신입. 몇 달째 아침마다 카페 '모퉁이'에 오는 단골. 하루와는 서로 이름을 알고 가벼운 농담을 주고받는 사이. 성수동의 4층 엘리베이터 없는 집에 산다.
userStyle: >
  존댓말. 짧게 1~2문장으로 말하고, 지문은 세 번에 한 번 정도 짧게 쓴다. 감정보다 상황을 말한다.
  하루가 전에 한 말을 가끔 되짚어 말한다.
seedMemory:
  haru:
    summary: >
      민수는 몇 달 동안 매일 아침 7시쯤 와서 아메리카노를 마시는 단골이다. 서로 이름을 알게 된 뒤로 주문 외의 대화를 조금씩 주고받는다.
    facts:
      - { text: "민수의 이름은 민수다", source: user }
      - { text: "민수는 디자인 회사에 올해 들어온 신입이다", source: user }
      - { text: "민수는 고양이 보리를 키운다", source: user }
      - { text: "민수는 성수동 4층 집에 산다", source: user }
    relationship:
      stage: friendly
      notes: ["서로 이름을 알고 가벼운 농담을 주고받는다"]
  yoon:
    summary: >
      민수는 몇 번 들른 손님이다. 지난주에 옛 만화책 『달빛 고양이』 단행본 두 권을 찾아 달라고 부탁하고 책값을 미리 냈다.
      하루는 카페 '모퉁이'의 바리스타로 이모 선영이 주문한 책을 받아 가려고 가끔 들른다.
    facts:
      - { text: "민수는 지난주에 『달빛 고양이』 단행본 두 권을 찾아 달라고 부탁하고 책값을 미리 냈다", source: user, day: -5 }
      - { text: "하루는 카페 '모퉁이'의 바리스타이고 이모 선영이 주문한 책을 받아 가려고 가끔 들른다", source: witnessed }
    relationship:
      stage: acquaintance
      notes: ["책을 찾아 달라고 부탁한 손님"]
  imo:
    summary: >
      민수는 아침 단골이라 얼굴과 아메리카노 주문은 안다. 선영은 아침에 시장을 보고 오후에 카페를 보고 저녁마다 책다락에 들른다.
    facts:
      - { text: "아침 단골 손님(민수)은 매일 아메리카노를 마신다", source: witnessed }
    relationship:
      stage: initial
      notes: ["아침 단골, 몇 번 마주친 정도"]
  cho:
    summary: >
      민수는 같은 시간에 카페에 오는 젊은 단골이다. 지난주에 카페에서 말을 텄고, 성수동 집 베란다에 물이 샌다길래 출장 다녀온 뒤에 한번 봐 주기로 했다.
    facts:
      - { text: "민수는 평일 아침 7시쯤 카페 '모퉁이'에 오는 젊은 단골이다", source: witnessed }
      - { text: "민수는 성수동 4층 집 베란다에 비가 오면 물이 샌다고 했고, 조 반장이 민수가 출장에서 돌아온 뒤에 가서 보고 견적을 내 주기로 했다", source: user, day: -3 }
    relationship:
      stage: acquaintance
      notes: ["아침 카페에서 말을 튼 사이, 집 수리를 봐 주기로 함"]
  jung:
    summary: >
      민수는 선영이 "아침 단골"이라고 말한 얼굴이다. 정 씨는 한 번 봤다.
    facts:
      - { text: "민수는 카페 '모퉁이'의 아침 단골이라고 선영이 말했다", source: told, by: 선영 }
    relationship:
      stage: initial
      notes: ["선영에게 들은 아침 단골"]
phases:
  - kind: chat
    expectTask: true
    characterId: haru
    slot: morning
    userTurns: 5
    beats:
      - fromUserTurn: 1
        goal: 평소처럼 아침 커피를 주문하며 인사한다. 내일부터 일주일 동안 지방 출장이라 당분간 못 온다고 말한다.
      - fromUserTurn: 2
        goal: >
          심부름을 부탁한다. 출장 중 언제든 책다락에 들를 일이 있으면, 민수가 지난주에 사장님께 찾아 달라고 부탁해 둔 옛 만화책 『달빛 고양이』 단행본(90년대, 두 권짜리)이
          들어왔는지 물어보고, 들어왔으면 대신 받아 맡아 달라고. 책값은 지난주에 미리 냈다고 말한다.
        reveal:
          - 민수는 지난주에 책다락 사장님께 『달빛 고양이』 단행본(두 권)을 찾아 달라고 부탁하고 책값을 미리 냈다
          - 민수는 내일부터 일주일 동안 지방 출장을 간다
      - fromUserTurn: 4
        goal: >
          지나가듯, 돌아오면 구석 자리의 조 반장님이 성수동 집 베란다 누수를 봐 주러 오기로 했다고 말한다(부탁은 아니다). 그 뒤 다녀오겠다고 인사한다.
        reveal:
          - 민수가 출장에서 돌아오면 조 반장이 성수동 집 베란다 누수를 보러 오기로 했다
  - kind: advance
    days: 7
  - kind: chat
    characterId: haru
    slot: morning
    userTurns: 6
    beats:
      - fromUserTurn: 1
        goal: 출장에서 돌아온 첫 아침. 인사하면서 얼마 만인지 묻는다("저 며칠 만에 온 거죠?"). 날짜는 자기도 헷갈린다는 투로.
      - fromUserTurn: 2
        goal: 자기가 없는 동안 책다락 심부름은 어떻게 됐는지 묻는다. 하루가 말한 결과에 대해 세부를 캐묻되 답을 암시하지 않는다.
      - fromUserTurn: 4
        goal: 자기가 없는 동안 동네나 가게에 무슨 일이 있었는지 묻는다. 그 뒤 출근한다.
    probes:
      - atUserTurn: 1
        kind: recall
        ask: 며칠 만에 온 건지 묻는다
        expected: "@world (the gap in days; the user left the day after day 1 and returns on day 8, so about a week / 7 days since they last spoke)"
      - atUserTurn: 2
        kind: recall
        ask: 책다락 심부름이 어떻게 됐는지 묻는다
        expected: "@ledger (the errand's outcome as recorded, or that it has not happened yet)"
      - atUserTurn: 4
        kind: negative
        ask: 그동안 동네나 가게에 무슨 일이 있었는지 묻는다
        expected: "@ledger (only events the ledger says Haru witnessed, was told, or heard as rumour; nothing invented)"
  - kind: chat
    characterId: cho
    slot: morning
    userTurns: 4
    beats:
      - fromUserTurn: 1
        goal: 같은 아침, 구석 자리의 조 반장에게 인사하고 출장에서 어제 돌아왔다고 말한다. 베란다 누수 봐 주시기로 한 건 언제 괜찮으신지 묻는다.
      - fromUserTurn: 3
        goal: 그동안 현장이나 동네는 별일 없었는지 묻는다. 그 뒤 출근한다.
    probes:
      - atUserTurn: 1
        kind: recall
        ask: 베란다 누수를 봐 주기로 한 걸 언제가 좋을지 묻는다
        expected: "@memory (he remembers the balcony leak at the user's Seongsu flat and that he agreed to look at it after the trip; any day he proposes is his to pick)"
      - atUserTurn: 3
        kind: negative
        ask: 그동안 현장이나 동네는 별일 없었는지 묻는다
        expected: "@ledger (only what the ledger says he witnessed, was told or heard as rumour; a quiet week is a quiet week)"
  - kind: chat
    characterId: yoon
    slot: afternoon
    userTurns: 4
    beats:
      - fromUserTurn: 1
        goal: 같은 날 오후, 책다락에 들러 인사하고 출장 다녀왔다고 말한다. 자기가 부탁해 둔 『달빛 고양이』가 어떻게 됐는지 묻는다(하루가 받아 갔는지, 아직 여기 있는지 자기는 모르는 척).
      - fromUserTurn: 3
        goal: 윤 사장의 답에 따라 세부를 묻는다(하루에게 줬다면 언제 누가 왔는지, 아직 있다면 지금 받아 간다). 고맙다고 하고 간다.
    probes:
      - atUserTurn: 1
        kind: recall
        ask: 자기 책이 어떻게 됐는지 묻는다
        expected: "@ledger (what the ledger says happened to the books from Yoon's side: if a scene records that he handed them to Haru, he says so and when; if nothing reached him, that they are still here or that he knows nothing of a pickup)"
      - atUserTurn: 3
        kind: negative
        ask: 세부를 묻는다
        expected: "@ledger (no invented visit, day or detail beyond what Yoon witnessed or was told)"
agreements:
  - about: 민수가 부탁한 『달빛 고양이』 두 권이 지금 어디에 있고, 하루가 책다락에서 받아 갔는지, 받아 갔다면 언제인지
    characters: [haru, yoon]
