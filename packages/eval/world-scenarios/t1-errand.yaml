# T1 · 심부름 (docs/10, 2단계 첫 테스트). User + one main character.
# Day 1: the user asks Haru to do something tomorrow, away from the café. The world advances a day
# and the errand is lived through off-screen (one model call, recorded in the ledger). Day 2: the
# user asks how it went. What is measured: does Haru speak from what actually happened (ledger),
# does she invent anything the ledger does not hold, and does she stay silent about what nobody
# said. The `no-world` arm skips the sync, which is what every 1:1 persona app does today.
id: t1-errand
world: haru-town
lang: ko
persona:
  name: 민수
  description: 28살, 작은 디자인 회사에 올해 들어온 신입. 몇 달째 아침마다 카페 '모퉁이'에 오는 단골. 하루와는 서로 이름을 알고 가벼운 농담을 주고받는 사이.
userStyle: >
  존댓말. 짧게 1~2문장으로 말하고, 지문은 세 번에 한 번 정도 짧게 쓴다. 감정보다 상황을 말한다.
  하루가 전에 한 말을 가끔 되짚어 말한다.
seedMemory:
  summary: >
    민수는 몇 달 동안 매일 아침 7시쯤 와서 아메리카노를 마시는 단골이다. 서로 이름을 알게 된 뒤로 주문 외의 대화를 조금씩 주고받는다.
    하루는 어제 아침 민수에게 "내일 오후에 이모 심부름으로 헌책방 '책다락'에 간다"고 말했다.
  facts:
    - { text: "민수의 이름은 민수다", source: user }
    - { text: "민수는 디자인 회사에 올해 들어온 신입이다", source: user }
    - { text: "민수는 고양이 보리를 키운다", source: user }
    - { text: "민수는 성수동 4층 엘리베이터 없는 집에 산다", source: user }
    - { text: "민수는 어릴 때 '달빛 고양이'라는 만화를 그렸다", source: user }
    - { text: "하루는 오늘 오후에 이모 심부름으로 헌책방 '책다락'에 가서 이모가 주문한 책을 받아 온다 (어제 민수에게 말했다)", source: self }
  relationship:
    stage: friendly
    notes: ["서로 이름을 알고 가벼운 농담을 주고받는다"]
phases:
  - kind: chat
    characterId: haru
    userTurns: 6
    beats:
      - fromUserTurn: 1
        goal: 평소처럼 아침 커피를 주문하며 인사한다. 하루가 어제 "내일 오후에 이모 심부름으로 책다락에 간다"고 한 말을 떠올리며 오늘 오후에 가는 게 맞는지 확인한다.
      - fromUserTurn: 2
        goal: >
          심부름을 부탁한다. 오늘 오후에 책다락에 가면, 민수가 지난주에 사장님께 찾아 달라고 부탁해 둔 옛 만화책 『달빛 고양이』 단행본(90년대, 두 권짜리)이
          들어왔는지 물어보고, 들어왔으면 대신 받아 와 달라고. 책값은 지난주에 미리 냈다고 말한다.
          하루가 승낙하면 고맙다고 하고, 망설이면 부담 주지 않고 한 번만 더 부탁한다.
        reveal:
          - 민수는 지난주에 책다락 사장님께 『달빛 고양이』 단행본(두 권)을 찾아 달라고 부탁하고 책값을 미리 냈다
      - fromUserTurn: 4
        goal: 심부름 얘기는 마무리하고 가볍게 다른 얘기(보리, 회사)를 하다가 출근한다고 인사한다.
  - kind: advance
    days: 1
  - kind: chat
    characterId: haru
    userTurns: 6
    beats:
      - fromUserTurn: 1
        goal: 다음날 아침. 인사하면서 어제 책다락에 다녀왔는지, 책이 들어왔는지 묻는다.
      - fromUserTurn: 2
        goal: 하루가 말한 결과에 대해 자세히 묻는다 (사장님이 뭐라고 했는지, 책 상태). 하루가 말하지 않은 세부는 캐묻되 답을 암시하지 않는다.
      - fromUserTurn: 4
        goal: 사장님이 민수에게 따로 전하라고 한 말이 있었는지 묻는다. 그 뒤 고맙다고 하고 가볍게 마무리해 출근한다.
    probes:
      - atUserTurn: 1
        kind: recall
        ask: 어제 책다락에 다녀왔는지, 책이 들어왔는지 묻는다
        expected: "@ledger.result"
      - atUserTurn: 2
        kind: recall
        ask: 사장님이 뭐라고 했는지, 책이 어땠는지 묻는다
        expected: "@ledger.details"
      - atUserTurn: 4
        kind: negative
        ask: 사장님이 민수에게 따로 전하라고 한 말이 있었는지 묻는다
        expected: "@ledger.none"
