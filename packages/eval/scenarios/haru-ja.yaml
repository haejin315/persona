# Romance / daily-life, Japanese. Same beats as haru-ko so KO→JA style transfer can be compared.
id: haru-ja
characterId: haru
lang: ja
persona:
  name: ユウキ
  description: 28歳、小さなデザイン会社に今年入った新人。口数は少ないが、話すときは正直。毎朝7時前後にカフェに寄ってアメリカーノを飲んでから出勤する。
userStyle: >
  丁寧語（です・ます）。1〜2文で短く話し、地の文はたまに（3回に1回程度）短く入れる。
  感情を直接言わず状況を話す。聞かれたら正直に答えるが長く説明しない。

beats:
  - fromUserTurn: 1
    goal: 雨の朝、初めて注文以外の会話を続ける。気まずいが興味がある様子を見せる。名前を聞き、ついでに自分の名前も言う。
    reveal:
      - ユウキの名前は「ユウキ」だ
      - ユウキはデザイン会社に今年入った新人だ
  - fromUserTurn: 6
    goal: ハルについて少しずつ聞く（いつから働いているか、なぜ朝だけか）。自分の話も少し漏らす。
    reveal:
      - ユウキは猫を一匹飼っていて、名前は「モチ」だ
  - fromUserTurn: 14
    goal: 会社の締め切りで疲れていることを見せる。ハルが気づくか見る。来月の引っ越しの話を出す。
    reveal:
      - ユウキは来月、中目黒に引っ越す
      - ユウキは今週の金曜日まで大きな締め切りがある
  - fromUserTurn: 24
    goal: もう少し個人的な会話。ハルの絵や休学の話が出たら慎重に関心を示す。週末に近所の古本屋に行くつもりだと言う。
    reveal:
      - ユウキは今週末、近所の古本屋に行くつもりだ
  - fromUserTurn: 36
    goal: 金曜の締め切りが終わったと言う。引っ越しが近づく。引っ越したらこのカフェに来られなくなるかもしれないとほのめかす。
    reveal:
      - ユウキの締め切りは無事に終わった

probes:
  - atUserTurn: 10
    ask: ハルが自分の名前を覚えているか自然に確認する（名前を直接言わない）。
    expected: ユウキ
  - atUserTurn: 20
    ask: 前に話した猫の名前をハルが覚えているか軽く確認する。
    expected: モチ
  - atUserTurn: 30
    ask: どこに引っ越すと言ったかハルが覚えているか聞く（地名を直接言わない）。
    expected: 中目黒
  - atUserTurn: 44
    ask: 自分の仕事をハルが覚えているか聞く（職業を直接言わない）。
    expected: デザイン会社の新人（デザイナー）
