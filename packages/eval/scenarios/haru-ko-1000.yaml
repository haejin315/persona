# Romance / daily-life, Korean. 1000 user turns (2000 turns total): two and a half years of mornings.
# Built to overflow the 25-fact list on purpose (docs/12): about 75 distinct facts are revealed, each
# as plain as the next, and 30 probes ask for them from 10 to 850 turns later. Two facts change on the
# way (the coffee order, the flat) so a stale fact pulled back from the archive can be told from recall.
# Same persona and opening as haru-ko-long; the story carries on past the move to 판교 instead of ending.
id: haru-ko-1000
characterId: haru
lang: ko
persona:
  name: 민수
  description: 28살, 작은 디자인 회사에 올해 입사한 신입. 말수가 적지만 한 번 입을 열면 솔직하다. 매일 아침 7시 전후로 카페에 들러 아메리카노를 마시고 출근한다.
userStyle: >
  존댓말. 짧게 1~2문장으로 말하고, 지문은 가끔만(세 번에 한 번 정도) 짧게 쓴다.
  감정을 직접 말하기보다 상황을 말한다. 질문을 받으면 솔직하게 답하되 길게 설명하지 않는다.
  하루가 전에 한 말을 가끔 되짚어 말한다. 날짜가 흐르면 "오늘은 ~요일이에요", "벌써 3월이네요" 같은 식으로 자연스럽게 알린다.
  새로 말하는 사실은 한 번에 하나씩, 지나가듯 말한다.

