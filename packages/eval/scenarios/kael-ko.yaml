# Fantasy / adventure, Korean. 50 user turns (100 turns total).
id: kael-ko
characterId: kael
lang: ko
persona:
  name: 리아
  description: 22살, 그레이마크 상인의 딸. 검을 잡아본 적은 없지만 고집이 세고 관찰력이 좋다. 전 재산을 털어 카엘을 고용했다.
userStyle: >
  반말에 가까운 편한 말투지만 처음엔 조금 조심스럽다. 1~3문장. 지문을 자주 쓴다(두 번에 한 번).
  카엘의 냉소에 기죽지 않고 되묻는다. 겁이 나도 티 내지 않으려 한다.

beats:
  - fromUserTurn: 1
    goal: 출발 직후. 짐을 버리라는 말에 반발하면서도 일부는 버린다. 카엘이 왜 이렇게 비싼지 묻는다. 자기 이름을 밝힌다. 왜 엘드린에 가는지는 아직 말하지 않는다.
    reveal:
      - 리아의 이름은 "리아"다
      - 리아는 그레이마크 상인의 딸이다
  - fromUserTurn: 7
    goal: 하프문으로 가는 길. 걷는 게 힘들지만 버틴다. 카엘의 과거를 조금씩 캐묻는다. 자기가 챙겨온 물건 얘기를 한다.
    reveal:
      - 리아는 어머니가 남긴 은반지를 목에 걸고 다닌다
      - 리아는 지도를 읽을 수 있다 (상단에서 배웠다)
  - fromUserTurn: 15
    goal: 하프문 역참에서 야영. 카엘에게 드디어 엘드린에 가는 이유를 말한다. 카엘의 반응을 본다.
    reveal:
      - 리아의 오빠 "유안"이 삼 년 전 회색 안개 때 실종됐고, 리아는 오빠가 살아있다고 믿는다
      - 유안은 당시 상단 호위대에 있었다
  - fromUserTurn: 25
    goal: 침묵의 숲 입구. 보급이 줄어든다. 카엘이 길을 망설이는 걸 알아챈다. 자기가 지도를 읽을 수 있다는 걸 다시 꺼내 돕겠다고 한다.
    reveal:
      - 리아는 식량이 닷새 분 남았다고 세어 봤다
  - fromUserTurn: 36
    goal: 숲 안. 위험한 상황을 함께 넘긴다. 카엘이 잠결에 누구 이름을 부르는 걸 들었다고 말한다. 카엘을 조금 더 신뢰하게 됐음을 행동으로 보인다.
    reveal:
      - 리아는 카엘이 잠결에 "리안"이라는 이름을 부르는 것을 들었다

probes:
  - atUserTurn: 8
    ask: 카엘이 자기 이름을 기억하는지 확인한다 (예. "내 이름은 알아?" 같은 식으로, 이름을 직접 말하지 않는다).
    expected: 리아
  - atUserTurn: 22
    ask: 자기가 왜 엘드린에 가는지 카엘이 제대로 알고 있는지 되묻는다 (이유를 직접 말하지 않는다).
    expected: 실종된 오빠 유안을 찾으러
  - atUserTurn: 32
    ask: 자기가 목에 걸고 다니는 것이 무엇인지, 누구 것인지 카엘이 기억하는지 묻는다.
    expected: 어머니의 은반지
  - atUserTurn: 42
    ask: 자기가 식량이 며칠 분 남았다고 했는지 카엘이 기억하는지 묻는다.
    expected: 닷새(5일)
  - atUserTurn: 50
    ask: 자기 오빠 이름을 카엘이 기억하는지 묻는다 (이름을 직접 말하지 않는다).
    expected: 유안
