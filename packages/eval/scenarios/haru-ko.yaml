# Romance / daily-life, Korean. 50 user turns (100 turns total).
id: haru-ko
characterId: haru
lang: ko
persona:
  name: 민수
  description: 28살, 작은 디자인 회사에 올해 입사한 신입. 말수가 적지만 한 번 입을 열면 솔직하다. 매일 아침 7시 전후로 카페에 들러 아메리카노를 마시고 출근한다.
userStyle: >
  존댓말. 짧게 1~2문장으로 말하고, 지문은 가끔만(세 번에 한 번 정도) 짧게 쓴다.
  감정을 직접 말하기보다 상황을 말한다. 질문을 받으면 솔직하게 답하되 길게 설명하지 않는다.

beats:
  - fromUserTurn: 1
    goal: 비 오는 아침, 처음으로 주문 외의 대화를 이어간다. 어색하지만 궁금한 티를 낸다. 이름을 묻고, 묻는 김에 자기 이름도 밝힌다.
    reveal:
      - 민수의 이름은 "민수"다
      - 민수는 디자인 회사에 올해 들어온 신입이다
  - fromUserTurn: 6
    goal: 하루에 대해 조금씩 묻는다 (언제부터 일했는지, 왜 아침만 하는지). 자기 얘기도 조금 흘린다.
    reveal:
      - 민수는 고양이 한 마리를 키우고 있고 이름은 "보리"다
      - 민수는 매일 7시쯤 들르는 이유가 출근 전 혼자 있는 시간이 필요해서라고 말한다
  - fromUserTurn: 14
    goal: 회사 마감 때문에 피곤하다는 걸 드러낸다. 하루가 알아채는지 본다. 다음 달 이사 얘기를 꺼낸다.
    reveal:
      - 민수는 다음 달에 성수동으로 이사한다
      - 민수는 이번 주 금요일까지 큰 마감이 있다
  - fromUserTurn: 24
    goal: 조금 더 개인적인 대화. 하루의 그림 얘기나 휴학 얘기가 나오면 조심스럽게 관심을 보인다. 주말에 동네 헌책방에 가볼 생각이라고 말한다.
    reveal:
      - 민수는 이번 주말에 동네 헌책방에 가볼 생각이다
      - 민수는 어릴 때 만화를 그렸지만 지금은 그리지 않는다
  - fromUserTurn: 36
    goal: 금요일 마감이 끝났다고 말한다. 이사 날짜가 다가온다. 이사하면 이 카페에 못 오게 될지도 모른다는 걸 넌지시 비친다. 하루의 반응을 기다린다.
    reveal:
      - 민수의 마감은 무사히 끝났다
      - 민수의 이사 날짜는 다다음 주 토요일이다

probes:
  - atUserTurn: 10
    ask: 하루가 자기 이름을 기억하는지 자연스럽게 확인한다 (예. "제 이름 기억하세요?" 같은 식으로).
    expected: 민수
  - atUserTurn: 20
    ask: 지난번에 말한 고양이 이름을 하루가 기억하는지 가볍게 확인한다 (고양이 사진을 보여주며 "이 녀석 이름 기억나요?" 같은 식).
    expected: 보리
  - atUserTurn: 30
    ask: 자기가 어디로 이사한다고 했는지 하루가 기억하는지 묻는다 (직접 동네 이름을 말하지 않는다).
    expected: 성수동
  - atUserTurn: 44
    ask: 자기가 무슨 일을 하는지 하루가 기억하는지 묻는다 (직접 직업을 말하지 않는다).
    expected: 디자인 회사 신입(디자이너)
  - atUserTurn: 50
    ask: 주말에 가봤다고 한 곳이 어디였는지 하루가 기억하는지 묻는다.
    expected: 헌책방
