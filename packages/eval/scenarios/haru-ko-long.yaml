# Romance / daily-life, Korean. 200 user turns (400 turns total): weeks of mornings.
# Same opening as haru-ko, then the story keeps moving (the move, a first project, a birthday, a job
# offer) so that facts revealed at turn 6 are probed at turn 60 and facts from turn 80 at turn 130.
id: haru-ko-long
characterId: haru
lang: ko
persona:
  name: 민수
  description: 28살, 작은 디자인 회사에 올해 입사한 신입. 말수가 적지만 한 번 입을 열면 솔직하다. 매일 아침 7시 전후로 카페에 들러 아메리카노를 마시고 출근한다.
userStyle: >
  존댓말. 짧게 1~2문장으로 말하고, 지문은 가끔만(세 번에 한 번 정도) 짧게 쓴다.
  감정을 직접 말하기보다 상황을 말한다. 질문을 받으면 솔직하게 답하되 길게 설명하지 않는다.
  하루가 전에 한 말을 가끔 되짚어 말한다. 날짜가 흐르면 "오늘은 ~요일이에요" 같은 식으로 자연스럽게 알린다.

beats:
  - fromUserTurn: 1
    goal: 비 오는 아침, 처음으로 주문 외의 대화를 이어간다. 어색하지만 궁금한 티를 낸다. 이름을 묻고, 묻는 김에 자기 이름도 밝힌다.
    reveal:
      - 민수의 이름은 "민수"다
      - 민수는 디자인 회사에 올해 들어온 신입이다
  - fromUserTurn: 6
    goal: 하루에 대해 조금씩 묻는다 (언제부터 일했는지, 왜 아침만 하는지). 자기 얘기도 조금 흘린다.
    reveal:
      - 민수는 고양이 한 마리를 키우고 있고 이름은 "보리"다
      - 민수는 매일 7시쯤 들르는 이유가 출근 전 혼자 있는 시간이 필요해서라고 말한다
  - fromUserTurn: 14
    goal: 회사 마감 때문에 피곤하다는 걸 드러낸다. 다음 달 이사 얘기를 꺼낸다.
    reveal:
      - 민수는 다음 달에 성수동으로 이사한다
      - 민수는 이번 주 금요일까지 큰 마감이 있다
  - fromUserTurn: 24
    goal: 조금 더 개인적인 대화. 주말에 동네 헌책방에 가볼 생각이라고 말한다.
    reveal:
      - 민수는 이번 주말에 동네 헌책방에 가볼 생각이다
      - 민수는 어릴 때 만화를 그렸지만 지금은 그리지 않는다
  - fromUserTurn: 36
    goal: 금요일 마감이 끝났다고 말한다. 이사 날짜가 다가온다. 이사하면 이 카페에 못 오게 될지도 모른다는 걸 넌지시 비친다.
    reveal:
      - 민수의 마감은 무사히 끝났다
      - 민수의 이사 날짜는 다다음 주 토요일이다
  - fromUserTurn: 50
    goal: 이사 전날 아침. 짐 정리 얘기. 이사 뒤에는 평일엔 못 오고 토요일 아침에 오겠다고 말한다. 하루의 반응을 본다.
    reveal:
      - 민수는 이사 뒤 토요일 아침마다 오겠다고 했다
  - fromUserTurn: 62
    goal: 이사 후 첫 토요일. 새 동네 얘기, 보리가 새 집에 적응 못 하는 얘기. 시간이 좀 흘렀다는 걸 자연스럽게 드러낸다.
    reveal:
      - 민수의 성수동 집은 4층이고 엘리베이터가 없다
      - 보리는 이사 뒤 사흘 동안 침대 밑에서 안 나왔다
  - fromUserTurn: 80
    goal: 회사에서 처음으로 맡은 프로젝트 얘기를 한다. 작은 카페 로고 리디자인이다. 하루에게 "카페 하는 입장에서" 의견을 묻는다. 하루의 그림 얘기가 나오면 조심스럽게 관심을 보인다.
    reveal:
      - 민수의 첫 프로젝트는 작은 카페의 로고 리디자인이다
  - fromUserTurn: 100
    goal: 오늘이 자기 생일이라고 지나가듯 말한다 (11월 3일). 축하를 바라는 티는 안 낸다. 하루가 어떻게 하는지 본다.
    reveal:
      - 민수의 생일은 11월 3일이다
  - fromUserTurn: 120
    goal: 하루에게 복학할 건지 직접 묻는다. 자기도 회사를 옮길까 고민 중이라고 털어놓는다. 판교의 큰 회사에서 제안을 받았다.
    reveal:
      - 민수는 판교의 큰 회사에서 이직 제안을 받았다
  - fromUserTurn: 140
    goal: 주말에 헌책방에 같이 가자고 제안한다. 거절당해도 가볍게 넘긴다. 하루가 전에 한 말을 기억하는지 되짚는다.
    reveal: []
  - fromUserTurn: 160
    goal: 헌책방에 같이 다녀온 뒤 첫 아침. 거기서 있었던 일을 짧게 되짚는다. 어릴 때 그린 만화 제목을 처음 말한다.
    reveal:
      - 민수가 어릴 때 그린 만화 제목은 "달빛 고양이"다
  - fromUserTurn: 180
    goal: 이직을 결정했다고 말한다. 12월 1일부터 판교로 출근한다. 아침에 못 오게 된다는 뜻이다. 하루의 반응을 기다린다.
    reveal:
      - 민수는 판교 회사로 이직을 결정했고 12월 1일부터 출근한다
  - fromUserTurn: 192
    goal: 마지막 주. 떠나기 전에 하루에게 하고 싶었던 말을 조금씩 한다. 다른 시간에 올 방법을 찾아본다 (토요일, 저녁). 하루가 그동안 자기에 대해 기억하는 것들을 듣고 싶어 한다.
    reveal: []

probes:
  - atUserTurn: 10
    ask: 하루가 자기 이름을 기억하는지 자연스럽게 확인한다 (이름을 직접 말하지 않는다).
    expected: 민수
  - atUserTurn: 60
    ask: 보리 사진을 보여주며 이름을 기억하는지 묻는다 (이름을 직접 말하지 않는다).
    expected: 보리
  - atUserTurn: 90
    ask: 자기가 처음 이사한다고 했을 때 어디로 간다고 했는지 기억하는지 묻는다 (동네 이름을 말하지 않는다).
    expected: 성수동
  - atUserTurn: 130
    ask: 자기 생일이 언제였는지 하루가 기억하는지 가볍게 묻는다 (날짜를 말하지 않는다).
    expected: 11월 3일
  - atUserTurn: 150
    ask: 자기가 회사에서 처음 맡은 프로젝트가 뭐였는지 하루가 기억하는지 묻는다 (직접 말하지 않는다).
    expected: 카페 로고 리디자인
  - atUserTurn: 170
    ask: 자기 집이 몇 층인지, 왜 보리를 안고 올라가야 하는지 하루가 기억하는지 묻는다 (층수를 말하지 않는다).
    expected: 4층, 엘리베이터 없음
  - atUserTurn: 200
    ask: 자기가 어릴 때 그린 만화 제목을 하루가 기억하는지 묻는다 (제목을 말하지 않는다).
    expected: 달빛 고양이
