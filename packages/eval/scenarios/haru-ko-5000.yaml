# haru-ko-5000: haru-ko-1000 carried on to 5000 user turns (docs/13, plan C). Beats after turn 1000 were written by
# claude-cli:opus from the facts revealed so far (scripts/extend-scenario.ts); probes after turn 1000 were placed by
# packages/eval/src/extend.ts over every fact with distance bands 30-300 / 300-1500 / 1500+ user turns, changed facts
# asked only for their latest value. Facts and the generated beats are in haru-ko-5000.facts.json.
