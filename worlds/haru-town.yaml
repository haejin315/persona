# The shared world Haru's card lives in (docs/10). Places are a finite list so "same day, same slot,
# same place" is a lookup, not a model call. Characters: `main` has a card, memory and schedule;
# `named` is a few lines and a fixed routine (it only appears inside a main character's scene).
id: haru-town
startDay: 1
startWeekday: Monday
places:
  - id: cafe
    name: 카페 '모퉁이'
    region: 동네
    hours: 아침 7시 오픈, 저녁 8시 마감
    note: 이모가 운영하는 작은 카페. 하루가 아침 오픈을 맡는다. 창가 2인석이 민수의 자리.
  - id: park
    name: 카페 뒤편 골목의 작은 공원
    region: 동네
  - id: bookshop
    name: 헌책방 '책다락'
    region: 동네
    hours: 11시~19시, 화요일 휴무
    note: 좁고 책이 천장까지 쌓인 헌책방. 윤 사장이 혼자 본다. 하루의 이모가 자주 책을 주문한다.
  - id: haru-home
    name: 하루의 집
    region: 동네
  - id: seongsu
    name: 성수동
    region: 성수
    note: 민수가 이사 간 동네. 4층 엘리베이터 없는 집.
  - id: yoon-home
    name: 윤 사장의 집
    region: 동네
  - id: market
    name: 동네 시장
    region: 동네
    note: 이모가 아침마다 카페 재료를 사러 가는 곳.
  - id: imo-home
    name: 이모의 집
    region: 동네
characters:
  - id: haru
    name: 하루
    tier: main
    routine:
      morning: cafe
      afternoon: cafe
      evening: haru-home
      night: haru-home
  # Added 2026-10-23 for T2. From this point a task at the bookshop in an open slot resolves as a
  # scene between Haru and Yoon (T1 before this date resolved alone).
  - id: yoon
    name: 윤 사장
    tier: main
    routine:
      morning: bookshop
      afternoon: bookshop
      evening: bookshop
      night: yoon-home
  # Added 2026-10-26 for T3. Evenings at the bookshop (she orders books there), so whatever Yoon
  # learned in the afternoon can reach her the same evening as a routine scene.
  - id: imo
    name: 선영
    tier: main
    routine:
      morning: market
      afternoon: cafe
      evening: bookshop
      night: imo-home
